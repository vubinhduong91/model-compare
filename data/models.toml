# Danh sách model được so sánh + cách tìm model đó ở từng nguồn dữ liệu.
# Models being compared + how to find each one in every data source.
#
# Thêm model mới / add a model:
#   1. Thêm một block [[models]] bên dưới.
#   2. Điền id của model ở từng nguồn (bỏ trống nếu nguồn đó không có model này):
#        openrouter      : id trên https://openrouter.ai/models (vd. "z-ai/glm-5.3")
#        openrouter_first_party : tên provider chính hãng trong danh sách endpoints (lấy giá niêm yết)
#        aa_slug         : phần cuối URL https://artificialanalysis.ai/models/<slug>
#        tbench_model    : tên model trên https://www.tbench.ai/leaderboard (cột Model)
#        vals_href       : link model trên https://www.vals.ai/benchmarks/swebench (vd. "/models/zai_glm-5.3")
#        arena_name      : tên model trên https://arena.ai/leaderboard/webdev (điểm nhập tay ở data/manual.toml)
#   3. Chạy: python scripts/update.py
#
# group:
#   anchor = mốc so sánh, peer = cùng tầm, flash = bản giá rẻ, closed = model đóng làm mốc tham chiếu

[[models]]
id = "glm-5.3"
name = "GLM-5.3"
vendor = "Z.ai (Zhipu)"
group = "anchor"
openrouter = "z-ai/glm-5.3"
openrouter_first_party = "Z.AI"
aa_slug = "glm-5-3"
tbench_model = "GLM-5.3"
vals_href = "/models/zai_glm-5.3"
arena_name = "glm-5.3"

