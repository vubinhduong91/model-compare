# Gói subscription dùng cho AI coding (trả phí theo tháng thay vì theo token).
# Coding subscriptions (flat monthly fee instead of per-token billing).
#
# price_month       = giá trả theo tháng (USD)
# price_month_yearly = giá quy ra mỗi tháng khi trả theo năm (nếu trang có ghi)
# usage_vi / usage_en = hạn mức như trang chính hãng mô tả (các hãng đo bằng đơn vị khác nhau, không quy đổi được)
# Cập nhật: mở url, sửa số, đổi checked.

